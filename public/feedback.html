<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoBot2 - 改善提案 / Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fcf7f2;
            color: #1c1917;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .feedback-card {
            background: #ffffff;
            width: 100%;
            max-width: 620px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #f3e8de;
            overflow: hidden;
        }
        .feedback-header {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            padding: 28px 32px;
            border-bottom: 1px solid #fed7aa;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #fdba74;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.15);
            flex-shrink: 0;
        }
        .header-title-group h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #c2410c;
        }
        .header-title-group p {
            font-size: 0.88rem;
            color: #78350f;
            margin-top: 4px;
            font-weight: 600;
        }
        .feedback-body {
            padding: 32px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 800;
            color: #44403c;
            margin-bottom: 8px;
        }
        .form-label span.required {
            color: #ef4444;
            margin-left: 4px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1.5px solid #e7e5e4;
            background: #fafaf9;
            font-family: inherit;
            font-size: 0.95rem;
            color: #1c1917;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #ea580c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.12);
        }
        .form-textarea {
            resize: vertical;
            min-height: 130px;
            line-height: 1.6;
        }
        .log-attach-badge {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-left: 4px solid #16a34a;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.84rem;
            color: #14532d;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feedback-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .btn-submit {
            padding: 14px 30px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45);
        }
        .btn-close {
            padding: 12px 22px;
            border-radius: 20px;
            border: 1.5px solid #e7e5e4;
            background: #ffffff;
            color: #78716c;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-close:hover {
            background: #f5f5f4;
            color: #44403c;
        }
        .notice-text {
            font-size: 0.82rem;
            color: #c2410c;
            margin-top: 14px;
            line-height: 1.5;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="feedback-card">
        <header class="feedback-header">
            <div class="brand-icon">💡</div>
            <div class="header-title-group">
                <h1 id="txtTitle">LingoBot2 改善提案・フィードバック</h1>
                <p id="txtSub">より使いやすいアプリを目指して、ご意見・ご要望をお聞かせください。</p>
            </div>
        </header>

        <main class="feedback-body">
            <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
                <!-- Auto Log Clipboard Badge -->
                <div class="log-attach-badge">
                    <span>📋</span>
                    <span id="txtLogBadge">動作ログは「改善提案」ボタン押下時にクリップボードへ自動コピーされています。</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="userName"><span id="lblUserName">👤 お名前</span> <span class="required">*</span></label>
                    <input type="text" id="userName" class="form-input" placeholder="例: 山田 太郎" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="userEmail"><span id="lblUserEmail">📧 メールアドレス</span> <span class="required">*</span></label>
                    <input type="email" id="userEmail" class="form-input" placeholder="例: example@domain.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="feedbackContent"><span id="lblContent">📝 改善提案内容</span> <span class="required">*</span></label>
                    <textarea id="feedbackContent" class="form-textarea" placeholder="機能の要望や使いづらい点など、ご自由にご記入ください..." required></textarea>
                </div>

                <div class="feedback-footer">
                    <button type="button" class="btn-close" id="btnClose" onclick="window.close()">閉じる</button>
                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <span>📧</span> <span id="txtSubmitBtn">送信 (メーラー起動)</span>
                    </button>
                </div>

                <p class="notice-text" id="txtNotice">
                    指示にしたがってログを本文に貼り付けてから送ってください。
                </p>
            </form>
        </main>
    </div>

    <script>
        // Multi-language dictionary strictly matching LingoBot2 System UI Language
        const i18nFeedback = {
            "tiếng Nhật": {
                title: "LingoBot2 改善提案・フィードバック",
                sub: "より使いやすいアプリを目指して、ご意見・ご要望をお聞かせください。",
                logBadge: "動作ログは「改善提案」ボタン押下時にクリップボードへ自動コピーされています。",
                lblName: "👤 お名前",
                phName: "例: 山田 太郎",
                lblEmail: "📧 メールアドレス",
                phEmail: "例: example@domain.com",
                lblContent: "📝 改善提案内容",
                phContent: "機能の要望や使いづらい点など、ご自由にご記入ください...",
                btnClose: "閉じる",
                btnSubmit: "送信 (メーラー起動)",
                notice: "指示にしたがってログを本文に貼り付けてから送ってください。",
                placeholderLog: "<-----ここにCtrl＋Vでログをコピーしてください----->"
            },
            "tiếng Việt": {
                title: "LingoBot2 Gợi ý cải tiến & Phản hồi",
                sub: "Hãy gửi cho chúng tôi ý kiến và đóng góp của bạn để hoàn thiện LingoBot2 tốt hơn.",
                logBadge: "Nhật ký hệ thống đã được tự động sao chép vào khay nhớ tạm khi bấm nút Gợi ý cải tiến.",
                lblName: "👤 Họ và tên",
                phName: "Ví dụ: Nguyễn Văn An",
                lblEmail: "📧 Địa chỉ Email",
                phEmail: "Ví dụ: example@domain.com",
                lblContent: "📝 Nội dung gợi ý cải tiến",
                phContent: "Nhập các tính năng mong muốn hoặc góp ý trải nghiệm...",
                btnClose: "Đóng",
                btnSubmit: "Gửi (Mở Mailer)",
                notice: "Vui lòng dán nhật ký (Ctrl+V) vào nội dung Email theo hướng dẫn trước khi gửi.",
                placeholderLog: "<-----Vui lòng Ctrl+V dán nhật ký vào đây----->"
            },
            "tiếng Anh": {
                title: "LingoBot2 Feedback & Suggestions",
                sub: "Help us make LingoBot2 better by sharing your feedback and suggestions.",
                logBadge: "System log has been automatically copied to clipboard when clicking Feedback button.",
                lblName: "👤 Full Name",
                phName: "e.g. John Smith",
                lblEmail: "📧 Email Address",
                phEmail: "e.g. example@domain.com",
                lblContent: "📝 Suggestion / Feedback Details",
                phContent: "Feel free to share feature requests or issues you experienced...",
                btnClose: "Close",
                btnSubmit: "Send (Launch Mailer)",
                notice: "Please paste the log (Ctrl+V) into the email body as instructed before sending.",
                placeholderLog: "<-----Please press Ctrl+V to paste the log here----->"
            }
        };

        // Get language parameter or fallback to localStorage
        function getUiLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang');
            if (!lang) {
                lang = localStorage.getItem("lingobot_ui_lang");
            }
            if (lang && i18nFeedback[lang]) return lang;
            return "tiếng Nhật"; // Default to Japanese if system language is JP
        }

        // Apply UI text matching system language
        function applyLanguageUi() {
            const lang = getUiLanguage();
            const dict = i18nFeedback[lang] || i18nFeedback["tiếng Nhật"];

            document.getElementById("txtTitle").textContent = dict.title;
            document.getElementById("txtSub").textContent = dict.sub;
            document.getElementById("txtLogBadge").textContent = dict.logBadge;
            document.getElementById("lblUserName").textContent = dict.lblName;
            document.getElementById("userName").placeholder = dict.phName;
            document.getElementById("lblUserEmail").textContent = dict.lblEmail;
            document.getElementById("userEmail").placeholder = dict.phEmail;
            document.getElementById("lblContent").textContent = dict.lblContent;
            document.getElementById("feedbackContent").placeholder = dict.phContent;
            document.getElementById("btnClose").textContent = dict.btnClose;
            document.getElementById("txtSubmitBtn").textContent = dict.btnSubmit;
            document.getElementById("txtNotice").textContent = dict.notice;
        }

        function handleFeedbackSubmit(event) {
            event.preventDefault();

            const lang = getUiLanguage();
            const dict = i18nFeedback[lang] || i18nFeedback["tiếng Nhật"];

            const name = document.getElementById("userName").value.trim();
            const email = document.getElementById("userEmail").value.trim();
            const content = document.getElementById("feedbackContent").value.trim();

            if (!name || !email || !content) {
                alert("Vui lòng nhập đầy đủ thông tin / すべての項目を入力してください。");
                return;
            }

            // Construct mailto URL with feedback content and clipboard paste instruction
            const recipient = "support@example.com";
            const subject = encodeURIComponent(`[LingoBot2] 改善提案・フィードバック (${name}様)`);
            const placeholderText = dict.placeholderLog || "<-----ここにCtrl＋Vでログをコピーしてください----->";

            const bodyText = `【LingoBot2 改善提案・フィードバック / Feedback】

■ お名前 / Name: ${name}
■ メールアドレス / Email: ${email}

■ 改善提案内容 / Details:
${content}

--------------------------------------------------
🖥️ システム動作ログ (System Logs):
${placeholderText}
--------------------------------------------------
送信日時: ${new Date().toLocaleString()}
`;

            const body = encodeURIComponent(bodyText);
            const mailtoUrl = `mailto:${recipient}?subject=${subject}&body=${body}`;

            // Launch default mail client
            window.location.href = mailtoUrl;
        }

        document.addEventListener("DOMContentLoaded", applyLanguageUi);
    </script>
</body>
</html>
