<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoBot2 - 改善提案・フィードバック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fcf7f2;
            color: #1c1917;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .feedback-card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #f3e8de;
            overflow: hidden;
        }
        .feedback-header {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            padding: 28px 32px;
            border-bottom: 1px solid #fed7aa;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #fdba74;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.15);
        }
        .header-title-group h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #c2410c;
        }
        .header-title-group p {
            font-size: 0.88rem;
            color: #78350f;
            margin-top: 4px;
            font-weight: 600;
        }
        .feedback-body {
            padding: 32px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 800;
            color: #44403c;
            margin-bottom: 8px;
        }
        .form-label span.required {
            color: #ef4444;
            margin-left: 4px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1.5px solid #e7e5e4;
            background: #fafaf9;
            font-family: inherit;
            font-size: 0.95rem;
            color: #1c1917;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #ea580c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.12);
        }
        .form-textarea {
            resize: vertical;
            min-height: 140px;
            line-height: 1.6;
        }
        .feedback-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .btn-submit {
            padding: 14px 32px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45);
        }
        .btn-close {
            padding: 12px 24px;
            border-radius: 20px;
            border: 1.5px solid #e7e5e4;
            background: #ffffff;
            color: #78716c;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-close:hover {
            background: #f5f5f4;
            color: #44403c;
        }
        .notice-text {
            font-size: 0.8rem;
            color: #78716c;
            margin-top: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="feedback-card">
        <header class="feedback-header">
            <div class="brand-icon">💡</div>
            <div class="header-title-group">
                <h1>LingoBot2 改善提案・フィードバック</h1>
                <p>より使いやすいアプリを目指して、ご意見・ご要望をお聞かせください。</p>
            </div>
        </header>

        <main class="feedback-body">
            <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="userName">👤 お名前 / Name <span class="required">*</span></label>
                    <input type="text" id="userName" class="form-input" placeholder="例: 山田 太郎" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="userEmail">📧 メールアドレス / Email <span class="required">*</span></label>
                    <input type="email" id="userEmail" class="form-input" placeholder="例: example@domain.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="feedbackContent">📝 改善提案内容 / Feedback Details <span class="required">*</span></label>
                    <textarea id="feedbackContent" class="form-textarea" placeholder="機能の要望や使いづらい点など、ご自由にご記入ください..." required></textarea>
                </div>

                <div class="feedback-footer">
                    <button type="button" class="btn-close" onclick="window.close()">閉じる</button>
                    <button type="submit" class="btn-submit">
                        <span>📧</span> <span>送信 (メーラー起動)</span>
                    </button>
                </div>

                <p class="notice-text">
                    ※ 「送信」ボタンを押すと、お使いのメールソフト（Outlook, Mail, Thunderbird等）が自動的に起動します。
                </p>
            </form>
        </main>
    </div>

    <script>
        function handleFeedbackSubmit(event) {
            event.preventDefault();

            const name = document.getElementById("userName").value.trim();
            const email = document.getElementById("userEmail").value.trim();
            const content = document.getElementById("feedbackContent").value.trim();

            if (!name || !email || !content) {
                alert("すべての項目を入力してください。");
                return;
            }

            const recipient = "support@example.com";
            const subject = encodeURIComponent("[LingoBot2] 改善提案・フィードバック");
            const bodyText = `【LingoBot2 改善提案・フィードバック】

■ お名前: ${name}
■ メールアドレス: ${email}

■ 改善提案・ご意見内容:
${content}

--------------------------------------------------
送信日時: ${new Date().toLocaleString('ja-JP')}
`;

            const body = encodeURIComponent(bodyText);
            const mailtoUrl = `mailto:${recipient}?subject=${subject}&body=${body}`;

            // Launch default mail client
            window.location.href = mailtoUrl;

            alert("メールソフトを起動しました。\nそのままメールを送信してください。ありがとうございます！");
        }
    </script>
</body>
</html>
